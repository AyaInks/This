<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Молодцы! ✨</title>
<style>
    @font-face {
        font-family: 'Luma';
        src: url('Luma.ttf') format('truetype');
    }

    :root {
        --theme-transition: 0.5s;
        --card-bg: rgba(15,15,31,0.55);
        --text-primary: rgba(255,255,255,1.00);
        --text-secondary: rgba(255,255,255,0.75);
        --text-muted: rgba(255,255,255,0.50);
        --text-dim: rgba(255,255,255,0.25);
        --border-soft: rgba(255,255,255,0.10);
        --border-hover: rgba(255,255,255,0.25);
        --blur-intensity: 12px;
        --shadow-soft: 0 8px 32px 0 rgba(15,15,31,0.30);
        --shadow-deep: 0 32px 80px rgba(15,15,31,0.60);
        --shadow-glow: 0 0 60px rgba(255,255,255,0.08);
        /* Адаптивные отступы */
        --card-pad-y: 64px;
        --card-pad-x: 48px;
        --card-radius: 28px;
        --h1-spacing: 10px;
        --body-pad: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        font-family: 'Luma', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text-primary);
        background: #0F0F1F;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        padding: var(--body-pad);
        /* Учитываем динамическую высоту мобильных браузеров */
        min-height: 100vh;
        min-height: 100dvh;
    }

    /* ===== BACKGROUND ===== */
    #star-field,
    #snow-canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }
    #star-field { z-index: 0; }

    /* ===== AMBIENT GLOW ===== */
    .ambient {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
    }
    .ambient.a1 {
        width: min(500px, 80vw);
        height: min(500px, 80vw);
        background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
        top: -150px; left: -150px;
        animation: floatA 18s ease-in-out infinite;
    }
    .ambient.a2 {
        width: min(600px, 90vw);
        height: min(600px, 90vw);
        background: radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%);
        bottom: -200px; right: -200px;
        animation: floatB 22s ease-in-out infinite;
    }

    @keyframes floatA {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(60px, 40px) scale(1.1); }
    }
    @keyframes floatB {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-60px, -40px) scale(1.15); }
    }

    /* ===== HERO CARD ===== */
    .hero-card {
        position: relative;
        z-index: 2;
        max-width: 680px;
        width: 100%;
        padding: var(--card-pad-y) var(--card-pad-x) calc(var(--card-pad-y) - 8px);
        background: var(--card-bg);
        backdrop-filter: blur(var(--blur-intensity));
        -webkit-backdrop-filter: blur(var(--blur-intensity));
        border-radius: var(--card-radius);
        outline: 1px solid var(--border-soft);
        box-shadow: var(--shadow-deep);
        text-align: center;
        opacity: 0;
        transform: translateY(20px) scale(0.96);
        animation: cardIn 1s cubic-bezier(0.34, 1.56, 0.64,1) 0.2s forwards;
        transition: outline-color 0.6s ease, box-shadow 0.6s ease, transform 0.6s ease;
    }

    /* Hover только для устройств с курсором */
    @media (hover: hover) and (pointer: fine) {
        .hero-card:hover {
            outline-color: var(--border-hover);
            box-shadow: var(--shadow-deep), var(--shadow-glow);
            transform: translateY(-2px);
        }
    }

    @keyframes cardIn {
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HEADING ===== */
    h1 {
        font-size: clamp(3rem, 11vw, 6.5rem);
        font-weight: 300;
        letter-spacing: var(--h1-spacing);
        margin: 0 0 24px;
        line-height: 1;
        color: var(--text-primary);
        opacity: 0;
        animation: fadeUp 0.8s ease 0.8s forwards;
        text-shadow: 0 0 30px rgba(255,255,255,0.15);
        /* Чтобы длинное слово не вылезало */
        overflow-wrap: break-word;
        word-break: break-word;
    }

    /* ===== SUBTITLE (typewriter) ===== */
    .subtitle {
        font-size: clamp(1rem, 3.2vw, 1.25rem);
        font-weight: 400;
        color: var(--text-secondary);
        margin: 0;
        min-height: 1.6em;
        letter-spacing: 1px;
    }

    .subtitle .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: var(--text-primary);
        vertical-align: -3px;
        margin-left: 2px;
        animation: blink 1s step-end infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
    }

    /* ===== FOOTER ===== */
    .footer {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 0; right: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--text-dim);
        z-index: 2;
        text-transform: uppercase;
        padding: 0 16px;
    }

    /* ============================================================
       MOBILE ADAPTATION
       ============================================================ */

    /* Планшеты и маленькие ноутбуки */
    @media (max-width: 768px) {
        :root {
            --card-pad-y: 52px;
            --card-pad-x: 36px;
            --card-radius: 24px;
            --h1-spacing: 8px;
        }
    }

    /* Смартфоны */
    @media (max-width: 600px) {
        :root {
            --card-pad-y: 44px;
            --card-pad-x: 24px;
            --card-radius: 20px;
            --h1-spacing: 5px;
            --body-pad: 16px;
        }
        h1 {
            font-size: clamp(2.4rem, 12vw, 4rem);
            margin-bottom: 18px;
        }
        .subtitle {
            font-size: clamp(0.95rem, 3.8vw, 1.15rem);
        }
        .footer {
            font-size: 10px;
            letter-spacing: 1.5px;
        }
    }

    /* Очень маленькие экраны (iPhone SE, Galaxy Fold и т.п.) */
    @media (max-width: 380px) {
        :root {
            --card-pad-y: 36px;
            --card-pad-x: 18px;
            --card-radius: 18px;
            --h1-spacing: 4px;
            --body-pad: 12px;
        }
        h1 {
            font-size: clamp(2rem, 13vw, 3.2rem);
            margin-bottom: 14px;
        }
        .subtitle {
            font-size: clamp(0.9rem, 4vw, 1.05rem);
            min-height: 2.4em; /* 2 строки на узких экранах */
        }
        .ambient { filter: blur(80px); opacity: 0.25; }
    }

    /* Ландшафт на телефонах */
    @media (max-height: 480px) and (orientation: landscape) {
        :root {
            --card-pad-y: 28px;
            --card-pad-x: 32px;
            --body-pad: 16px;
        }
        h1 {
            font-size: clamp(1.8rem, 8vh, 3rem);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: clamp(0.85rem, 3vh, 1rem);
            min-height: 1.4em;
        }
        .footer { display: none; } /* Не мешаем в ландшафте */
        .ambient.a1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .ambient.a2 { width: 350px; height: 350px; bottom: -120px; right: -120px; }
    }

    /* Уважение к пользователям с ограниченной анимацией */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
        .hero-card, h1 { opacity: 1; transform: none; }
    }
</style>
</head>
<body>

<div class="ambient a1"></div>
<div class="ambient a2"></div>
<canvas id="star-field"></canvas>
<canvas id="snow-canvas"></canvas>

<main class="hero-card">
    <h1>Молодцы!</h1>
    <p class="subtitle" id="subtitle"></p>
</main>

<div class="footer">Powered by Aya</div>

<script>
    /* ===== HELPERS ===== */
    const isMobile = () => window.matchMedia('(max-width: 600px)').matches;
    const isLandscapePhone = () =>
        window.matchMedia('(max-height: 480px) and (orientation: landscape)').matches;

    /* ===== TYPEWRITER ===== */
    const phrases = [
        "Ссылка собрана!",
        "Вы реально молодцы и т.д",
        "Даже если не справились!"
    ];
    const subtitle = document.getElementById('subtitle');
    let pIdx = 0, cIdx = 0, deleting = false;

    function typewrite() {
        const phrase = phrases[pIdx];
        const text = phrase.substring(0, cIdx);
        subtitle.innerHTML = text + '<span class="cursor"></span>';

        if (!deleting && cIdx === phrase.length) {
            setTimeout(() => { deleting = true; typewrite(); }, 2200);
            return;
        }
        if (deleting && cIdx === 0) {
            deleting = false;
            pIdx = (pIdx + 1) % phrases.length;
            setTimeout(typewrite, 400);
            return;
        }
        cIdx += deleting ? -1 : 1;
        setTimeout(typewrite, deleting ? 40 : 80);
    }
    setTimeout(typewrite, 1600);

    /* ===== STAR FIELD ===== */
    const stars = document.getElementById('star-field');
    const sCtx = stars.getContext('2d');
    let starList = [];

    function getStarCount() {
        if (isLandscapePhone()) return 30;
        if (isMobile()) return 45;
        return 80;
    }

    function initStars() {
        stars.width = window.innerWidth;
        stars.height = window.innerHeight;
        const count = getStarCount();
        starList = Array.from({ length: count }, () => ({
            x: Math.random() * stars.width,
            y: Math.random() * stars.height,
            r: Math.random() * 1.2 + 0.3,
            a: Math.random(),
            s: Math.random() * 0.02 + 0.005
        }));
    }

    function drawStars() {
        sCtx.clearRect(0, 0, stars.width, stars.height);
        starList.forEach(s => {
            s.a += s.s;
            const alpha = (Math.sin(s.a) + 1) / 2 * 0.8;
            sCtx.fillStyle = `rgba(255,255,255,${alpha})`;
            sCtx.beginPath();
            sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            sCtx.fill();
        });
        requestAnimationFrame(drawStars);
    }
    initStars();
    drawStars();

    /* ===== SNOW ===== */
    const snow = document.getElementById('snow-canvas');
    const ctx = snow.getContext('2d');
    let flakes = [];

    function getFlakeCount() {
        if (isLandscapePhone()) return 30;
        if (isMobile()) return 50;
        return 90;
    }

    function initSnow() {
        snow.width = window.innerWidth;
        snow.height = window.innerHeight;
        const count = getFlakeCount();
        flakes = Array.from({ length: count }, () => ({
            x: Math.random() * snow.width,
            y: Math.random() * snow.height,
            r: Math.random() * 2 + 0.8,
            dx: Math.random() * 0.6 - 0.3,
            dy: Math.random() * 0.6 + 0.3
        }));
    }

    function drawSnow() {
        ctx.clearRect(0, 0, snow.width, snow.height);
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        flakes.forEach(f => {
            f.x += f.dx;
            f.y += f.dy;
            if (f.y > snow.height) { f.y = -5; f.x = Math.random() * snow.width; }
            if (f.x > snow.width) f.x = 0;
            if (f.x < 0) f.x = snow.width;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(drawSnow);
    }
    initSnow();
    drawSnow();

    /* ===== RESIZE (debounced) ===== */
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            initStars();
            initSnow();
        }, 200);
    });
</script>

</body>
</html>
