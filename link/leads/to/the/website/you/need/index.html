```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Молодцы!</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    position: relative;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
      radial-gradient(
        circle at 20% 20%,
        rgba(108, 92, 231, 0.20),
        transparent 32%
      ),
      radial-gradient(
        circle at 80% 80%,
        rgba(0, 210, 255, 0.15),
        transparent 35%
      ),
      #0f0f1f;

    color: #ffffff;

    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    text-align: center;
  }

  /* Мягкие светящиеся пятна на фоне */

  body::before,
  body::after {
    content: "";
    position: absolute;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.35;

    pointer-events: none;

    animation: float 9s ease-in-out infinite alternate;
  }

  body::before {
    top: -180px;
    left: -120px;

    background:
      linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
      );
  }

  body::after {
    right: -160px;
    bottom: -180px;

    background:
      linear-gradient(
        135deg,
        #06b6d4,
        #6366f1
      );

    animation-delay: -4s;
  }

  /* Главная стеклянная карточка */

  main {
    position: relative;
    z-index: 2;

    width: min(720px, 100%);

    padding: clamp(40px, 8vw, 72px)
             clamp(28px, 7vw, 64px);

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 28px;

    background:
      linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.09),
        rgba(255, 255, 255, 0.035)
      );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);

    animation: appear 0.8s ease-out;
  }

  /* Маленький декоративный элемент */

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 22px;
    padding: 8px 14px;

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 999px;

    background: rgba(255, 255, 255, 0.06);

    color: rgba(255, 255, 255, 0.75);

    font-size: 0.85rem;
    letter-spacing: 0.04em;

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .badge-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #8bffb0;

    box-shadow:
      0 0 12px rgba(139, 255, 176, 0.9);
  }

  h1 {
    position: relative;

    margin: 0 0 18px;

    font-size: clamp(4rem, 14vw, 8rem);

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.06em;

    color: #ffffff;

    text-shadow:
      0 0 35px rgba(139, 92, 246, 0.20);

    /* Градиентный текст */

    background:
      linear-gradient(
        120deg,
        #ffffff 15%,
        #d9ccff 45%,
        #8be9ff 85%
      );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
  }

  p {
    max-width: 560px;

    margin: 0 auto;

    color: rgba(255, 255, 255, 0.65);

    font-size: clamp(1.05rem, 3vw, 1.3rem);

    line-height: 1.6;

    font-weight: 400;
  }

  /* Декоративная светящаяся линия */

  .line {
    width: min(260px, 70%);

    height: 1px;

    margin: 30px auto 24px;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(139, 92, 246, 0.8),
        rgba(0, 210, 255, 0.8),
        transparent
      );

    box-shadow:
      0 0 18px rgba(139, 92, 246, 0.35);
  }

  /* Маленькая подсказка снизу */

  .hint {
    margin-top: 28px;

    color: rgba(255, 255, 255, 0.35);

    font-size: 0.8rem;

    letter-spacing: 0.08em;

    text-transform: uppercase;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.98);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes float {
    from {
      transform: translate(0, 0) scale(1);
    }

    to {
      transform: translate(45px, 30px) scale(1.12);
    }
  }

  /* Адаптация для телефонов */

  @media (max-width: 600px) {
    body {
      padding: 16px;
    }

    main {
      border-radius: 22px;
      padding: 42px 24px;
    }

    h1 {
      font-size: clamp(3.5rem, 20vw, 6rem);
    }

    p {
      font-size: 1rem;
    }
  }

  /* Если пользователь отключил анимации */

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
    }
  }
</style>
</head>

<body>

  <main>

    <div class="badge">
      <span class="badge-dot"></span>
      Всё готово
    </div>

    <h1>Молодцы!</h1>

    <div class="line"></div>

    <p>
      Ссылка собрана правильно.<br>
      Добро пожаловать на курс.
    </p>

    <div class="hint">
      Добро пожаловать
    </div>

  </main>

</body>
</html>
```
